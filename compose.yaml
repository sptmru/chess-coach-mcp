name: chess-coach
x-app: &app
  image: chess-coach-mcp:local
  build:
    context: .
    target: runtime
  env_file: .env
  environment:
    DB_HOST: db
    DB_PORT: 5432
    PORT: 8080
    NODE_ENV: production
    STOCKFISH_PATH: /usr/games/stockfish
  networks: [database, default]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-chess}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    command: [node, dist/database/migrate.js]
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'
  app:
    <<: *app
    ports: ['127.0.0.1:${APP_PORT:-8080}:8080']
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
    init: true
    stop_grace_period: 35s
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
networks:
  database:
    internal: true
volumes:
  postgres-data:
